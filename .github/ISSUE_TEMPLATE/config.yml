# Everything that is not a bug report or a feature request has a better home
# than a blank issue, and saying which is cheaper than reading a mis-filed one.
blank_issues_enabled: false
contact_links:
  - name: The language reference
    url: https://carlosdlw.github.io/mincplus/
    about: What a `.mx` file means, page by page, with anything unimplemented marked as such.
  - name: Report a security vulnerability
    url: https://github.com/CarlosDlw/mincplus/security/advisories/new
    about: Private reporting, for anything exploitable. Please do not open a public issue first — see SECURITY.md.
