name: ci

on:
  push:
  pull_request:

# Superseded runs on the same ref are cancelled instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache libgtest-dev
      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake ccache googletest
      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ninja cmake

      # GTest is resolved by tests/unit/CMakeLists.txt: package config, then
      # pkg-config, then a pinned FetchContent download. The package installs
      # above are a speed-up, not a requirement, so a runner that cannot find
      # GTest still builds.
      #
      # A cold ccache is the same as no ccache, so the cache is carried between
      # runs. The key is per-platform and per-commit, and the restore prefix
      # means a run always starts from the most recent cache for its platform;
      # only the process-cache is reused, never the configure step.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/Library/Caches/ccache
            ~/AppData/Local/ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci

  # AddressSanitizer and UndefinedBehaviorSanitizer, on one platform. The lexer
  # indexes bytes directly, so "no read past the end" deserves to be checked by
  # a tool rather than by reading the code.
  sanitize:
    name: sanitize (ubuntu, ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache libgtest-dev

      # A separate cache from the `ci` job: the sanitizer build compiles with
      # different flags, so its objects cannot be shared with the plain one.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-sanitize-${{ github.sha }}
          restore-keys: ccache-sanitize-
      - name: Configure
        run: cmake --preset sanitize
      - name: Build
        run: cmake --build --preset sanitize
      - name: Test
        run: ctest --preset sanitize

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          # Keep this version close to the one developers run locally: a newer
          # formatter can reflow code the older one accepted.
          clang-format --version
          find include src tests \( -name '*.h' -o -name '*.cc' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  # The documentation site. It is a real check and not a deploy: the site is
  # built with `onBrokenLinks: 'throw'`, so a page that links to a page that does
  # not exist fails here rather than in a reader's browser. Nothing about the
  # C++ build depends on this job, which is why it is its own.
  docs:
    name: docs (Docusaurus build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
        working-directory: website
      - name: Typecheck
        run: npm run typecheck
        working-directory: website
      - name: Build
        run: npm run build
        working-directory: website

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy ninja-build cmake ccache
      - name: Configure
        # clang-tidy cannot consume a GNU compile database (GCC emits flags
        # such as -fmodules-ts that it does not understand), so this job
        # configures with clang++.
        run: cmake --preset ci -DCMAKE_CXX_COMPILER=clang++
      # The analysis, not the build, is what this job spends its time on: a
      # single clang-tidy invocation checks its files one at a time, which is
      # minutes of a runner sitting idle. `run-clang-tidy` drives the same tool
      # in parallel with the same checks and the same failure exit code, so the
      # only thing that changes is the wall clock. `make tidy` runs exactly this,
      # with a sequential fallback for a machine that lacks the helper.
      - name: Run clang-tidy
        run: |
          clang-tidy --version
          run-clang-tidy -p build/ci -j "$(nproc)" -quiet \
            -warnings-as-errors '*' 'src/.*\.cc'
