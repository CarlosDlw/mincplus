name: ci

on:
  push:
  pull_request:

# Superseded runs on the same ref are cancelled instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache libgtest-dev
      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake ccache googletest

      # LLVM is not something to inherit from the runner image: the action says
      # why the release is pinned and what it exports for the preset to read.
      - uses: ./.github/actions/install-llvm

      # GTest is resolved by tests/unit/CMakeLists.txt: package config, then
      # pkg-config, then a pinned FetchContent download. The package installs
      # above are a speed-up, not a requirement, so a runner that cannot find
      # GTest still builds.
      #
      # A cold ccache is the same as no ccache, so the cache is carried between
      # runs. The key is per-platform and per-commit, and the restore prefix
      # means a run always starts from the most recent cache for its platform;
      # only the process-cache is reused, never the configure step.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/Library/Caches/ccache
            ~/AppData/Local/ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-

      # Windows names its compiler, because the image also has MinGW's GCC on
      # PATH (`C:\mingw64\bin`) and CMake would pick it -- and a MinGW driver
      # cannot link the MSVC-built LLVM libraries, which is a link failure about
      # C++ ABIs wearing a symbol's name. MSVC is also the toolchain this project
      # states support for (`cmake/minc_cxx.cmake` sets `/utf-8`,
      # `/Zc:__cplusplus` and `/W4 /permissive-` for it), so it is the one to
      # test. The environment comes from the installed Visual Studio.
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci

  # Windows is a job of its own rather than a matrix entry, because it is the one
  # platform where the toolchain is decided by what can supply a *development*
  # tree of LLVM. LLVM's own prebuilt Windows packages are a toolchain package --
  # binaries, no `LLVMConfig.cmake`, no libraries to link against -- so
  # `find_package(LLVM CONFIG)` cannot succeed with them, and the installer and
  # Chocolatey's package are the same thing. MSYS2's MinGW-w64 packages do ship a
  # development tree, and they are the same ABI as the GCC already on this
  # image's PATH, so the whole job runs in that one environment: GCC compiles,
  # MinGW's LLVM links, and no two toolchains have to agree about anything.
  #
  # What that does *not* do is exercise MSVC, which `cmake/minc_cxx.cmake` has
  # flags for (`/utf-8`, `/Zc:__cplusplus`, `/W4 /permissive-`). That is a gap and
  # it is recorded as one rather than dressed up.
  build-test-windows:
    name: build-test (windows, MSYS2 MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      # The presets read this (`CMakePresets.json`), and inside MSYS2 the MinGW
      # development tree is at `/mingw64`.
      MINC_LLVM_ROOT: /mingw64
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-ccache

      - name: Report what was installed
        run: |
          g++ --version | head -1
          llvm-config --version
          cmake --version | head -1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci

  # AddressSanitizer and UndefinedBehaviorSanitizer, on one platform. The lexer
  # indexes bytes directly, so "no read past the end" deserves to be checked by
  # a tool rather than by reading the code.
  sanitize:
    name: sanitize (ubuntu, ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache libgtest-dev

      - uses: ./.github/actions/install-llvm

      # A separate cache from the `ci` job: the sanitizer build compiles with
      # different flags, so its objects cannot be shared with the plain one.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-sanitize-${{ github.sha }}
          restore-keys: ccache-sanitize-
      - name: Configure
        run: cmake --preset sanitize
      - name: Build
        run: cmake --build --preset sanitize
      - name: Test
        run: ctest --preset sanitize

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The formatter comes from the pinned LLVM release and not from the
      # distribution, and that is the whole point of this job: `clang-format`
      # changes its mind between majors, so a tree that is clean under 22 is not
      # clean under 18. The gate compares a developer against CI, which only
      # means something if both run the same tool.
      - uses: ./.github/actions/install-llvm
      # The command itself lives in the Makefile, which is where a developer runs
      # it too: the action exports `CLANG_FORMAT`, and the target uses it.
      - name: Check formatting
        run: make format-check

  # The documentation site. It is a real check and not a deploy: the site is
  # built with `onBrokenLinks: 'throw'`, so a page that links to a page that does
  # not exist fails here rather than in a reader's browser. Nothing about the
  # C++ build depends on this job, which is why it is its own.
  docs:
    name: docs (Docusaurus build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
        working-directory: website
      - name: Typecheck
        run: npm run typecheck
        working-directory: website
      - name: Build
        run: npm run build
        working-directory: website

  # The analysis, not the build, is what this job spends its time on. The command
  # is the Makefile's (`make tidy`): it configures a clang build of its own --
  # clang-tidy cannot consume a GNU compile database -- and drives the analyzer in
  # parallel through the helper from the same release, with a sequential fallback.
  # The job only says which LLVM that release is, through the action.
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache
      - uses: ./.github/actions/install-llvm
      - name: Run clang-tidy
        run: |
          "$CLANG_TIDY" --version
          make tidy
