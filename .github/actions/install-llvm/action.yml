# The LLVM development files this compiler builds against, and the formatter that
# belongs to the same release.
#
# LLVM is not an optional dependency: `src/ir` and `src/backend` include
# `llvm/*`, and the configure step refuses to run without it. A runner image may
# happen to carry a distribution LLVM, but "happens to carry" is not a build
# input -- its version would drift with the image, and the ABI requirements this
# project states (RTTI on, exceptions off, assertions off) would be whatever the
# image's packager chose. A mismatch there is not a link error; it is an ODR
# violation across the LLVM boundary, which is why `CMakeLists.txt` checks.
#
# The formatter and the analyzer are installed from the same source and pinned to
# the same major, because both are version-dependent tools and a gate that
# compares a developer against CI only means something if both run the same one:
# the tree that is clean under 22 is not clean under 18. One version, one place.
#
# What it exports -- the names are the Makefile's, so the CI jobs run `make
# format-check` and `make tidy` rather than restating the commands:
#   MINC_LLVM_ROOT   where LLVM is, for the presets (`CMakePresets.json`)
#   CLANG_FORMAT     the formatter the `format` gate runs
#   CLANG_TIDY       the analyzer the `tidy` gate runs
#   RUN_CLANG_TIDY   the parallel driver for it, from the same release
#   TIDY_CXX         the clang the tidy gate configures the sources with
name: install LLVM
description: Install LLVM and its matching clang tools, and export where they are.

inputs:
  major:
    description: The LLVM major version to build against.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - name: Install LLVM (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
        # apt.llvm.org is LLVM's own archive. The distribution's LLVM packages
        # trail by several releases, and the versioned series is what pins the
        # major rather than "whatever this image has today".
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        sudo add-apt-repository -y \
          "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${{ inputs.major }} main"
        sudo apt-get update
        sudo apt-get install -y \
          "llvm-${{ inputs.major }}-dev" \
          "clang-${{ inputs.major }}" \
          "clang-tools-${{ inputs.major }}" \
          "clang-tidy-${{ inputs.major }}" \
          "clang-format-${{ inputs.major }}"
        prefix="/usr/lib/llvm-${{ inputs.major }}"
        {
          echo "MINC_LLVM_ROOT=${prefix}"
          echo "CLANG_FORMAT=clang-format-${{ inputs.major }}"
          echo "CLANG_TIDY=clang-tidy-${{ inputs.major }}"
          # The package's own driver, not whatever `run-clang-tidy` the image
          # happens to have on PATH: a driver from another release would run
          # another analyzer and report another release's findings.
          echo "RUN_CLANG_TIDY=${prefix}/bin/run-clang-tidy"
          echo "TIDY_CXX=clang++-${{ inputs.major }}"
        } >> "$GITHUB_ENV"

    - name: Install LLVM (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        # The versioned formula first: Homebrew's plain `llvm` tracks the newest
        # release, which is not always the one this project is written against.
        brew install "llvm@${{ inputs.major }}" || brew install llvm
        prefix="$(brew --prefix "llvm@${{ inputs.major }}" 2>/dev/null \
          || brew --prefix llvm)"
        # Homebrew's `llvm` is keg-only, so its binaries are not on PATH.
        {
          echo "MINC_LLVM_ROOT=${prefix}"
          echo "CLANG_FORMAT=${prefix}/bin/clang-format"
          echo "CLANG_TIDY=${prefix}/bin/clang-tidy"
          echo "RUN_CLANG_TIDY=${prefix}/bin/run-clang-tidy"
          echo "TIDY_CXX=${prefix}/bin/clang++"
        } >> "$GITHUB_ENV"

    - name: Install LLVM (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install -y llvm
        # The prefix is *found*, not assumed: the installer's layout is its own,
        # and `bin/llvm-config.exe` is not always the real one (Chocolatey shims
        # it). `LLVMConfig.cmake` is the file the configure step needs, so its
        # location is what decides where the prefix is -- and a package that
        # ships no development files fails here, with that sentence, rather than
        # at `find_package` with a list of names it looked for.
        $prefix = $null
        $cfg = Get-ChildItem "C:\Program Files\LLVM", "C:\ProgramData\chocolatey\lib\llvm" `
                 -Filter LLVMConfig.cmake -Recurse -ErrorAction SilentlyContinue |
               Select-Object -First 1
        if ($cfg) { $prefix = $cfg.Directory.Parent.Parent.Parent.FullName }
        elseif (Test-Path "C:\Program Files\LLVM") { $prefix = "C:\Program Files\LLVM" }
        if (-not $prefix) { throw "LLVM was installed but has no CMake package (LLVMConfig.cmake)" }
        $prefix = $prefix -replace '\\', '/'
        {
          echo "MINC_LLVM_ROOT=$prefix"
          echo "CLANG_FORMAT=$prefix/bin/clang-format.exe"
          echo "CLANG_TIDY=$prefix/bin/clang-tidy.exe"
        } >> $env:GITHUB_ENV
        Write-Host "LLVM prefix: $prefix"
        Write-Host "CMake package: $cfg"

    # Printed rather than assumed: the configure step reports the version it
    # found, and this says which directory it was told to look in, so a run that
    # picks up the wrong LLVM says so in the log instead of in a compiler error.
    - name: Report
      shell: bash
      run: |
        echo "MINC_LLVM_ROOT=$MINC_LLVM_ROOT"
        echo "CLANG_FORMAT=$CLANG_FORMAT"
        echo "CLANG_TIDY=$CLANG_TIDY"
        echo "RUN_CLANG_TIDY=$RUN_CLANG_TIDY"
        echo "TIDY_CXX=$TIDY_CXX"
